<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="/Current Resident CSS/Maint_Req.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="cr-02-maintenance-request">
    <div class="rectangle-5"></div>
    <img class="background" src="background0.png" />
    <div class="header"></div>
    <div class="action-items">
      <img class="image-1" src="image-10.png" />
      <a href="index.html" class="Logout">Logout</a>
      <div class="ellipse-1"></div>
    </div>
    <img class="logo" src="logo0.png" />
    <div class="maintenance-request">Maintenance Request</div>
    <div class="sidebar"></div>
    <div class="nav-buttons">
      <a href="Res_Dash2.html" class="dashboard">Dashboard</a>
      <a href="Pay_rent.html" class="pay-rent">Pay Rent</a>
      <a href="Maint_req.html" class="maintenance">Maintenance</a>
      <a href="Lease_info.html" class="my-lease">My Lease</a>
    </div>
    <div class="rectangle-9"></div>
    <div class="priority">Priority</div>
    <div class="rectangle-16"></div>
    <div class="submit-a-maintenance-request">Submit A Maintenance Request</div>
    <div class="rectangle-10"></div>
    <div class="rectangle-12"></div>
    <img class="polygon-2" src="polygon-20.svg" />
    <div class="rectangle-14"></div>
    <div class="rectangle-11"></div>
    <div class="rectangle-13"></div>
    <div class="rectangle-15"></div>
    <button class="cancel" type="button" id="cancel-clear">Cancel</button>
    <div class="issue-category">Issue Category</div>
    <select class="dropdown-issue-category" name="issue-category" aria-label="Issue category">
      <option value="">Select category</option>
      <option value="plumbing">Plumbing</option>
      <option value="electrical">Electrical</option>
      <option value="hvac">HVAC / Heating</option>
      <option value="appliance">Appliance</option>
      <option value="pest">Pest control</option>
      <option value="other">Other</option>
    </select>
    <div class="location-unit-room">Location (Unit/room)</div>
    <input
      class="dropdown-location"
      type="text"
      name="location"
      aria-label="Location (unit/room)"
      placeholder="Enter location"
    />
    <select class="dropdown-priority" name="priority" aria-label="Priority">
      <option value="">Select priority</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
    <div class="preferred-access-time">Preferred Access Time</div>
    <select class="dropdown-access-time" name="access-time" aria-label="Preferred access time">
      <option value="">Select time</option>
      <option value="morning">Morning (8am–12pm)</option>
      <option value="afternoon">Afternoon (12pm–5pm)</option>
      <option value="evening">Evening (5pm–8pm)</option>
      <option value="any">Any time</option>
    </select>
    <div class="rectangle-17"></div>
    <div class="describe-the-issue">Describe the issue</div>
    <textarea
      class="issue-description-input"
      name="issue-description"
      aria-label="Describe the issue"
      placeholder="Type details"
      rows="3"
    ></textarea>
    <img class="polygon-1" src="polygon-10.svg" />
    <img class="polygon-3" src="polygon-30.svg" />
    <img class="polygon-4" src="polygon-40.svg" />
    <div class="rectangle-18"></div>
    <button
      class="submit-request-button"
      type="button"
      id="submit-request-button"
    >
      Submit Request
    </button>
    <input class="upload-photo-file" type="file" name="upload-photo-file" aria-label="Upload photo or file" />
    <input class="access-notes-instructions" type="text" name="access-notes" aria-label="Access notes / instructions" placeholder="Access notes / instructions" />
  </div>
  <script>
    (function () {
      const root = document.querySelector(".cr-02-maintenance-request");
      const cancelBtn = document.getElementById("cancel-clear");
      const submitBtn = document.getElementById("submit-request-button");
      if (!root) return;

      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          root.querySelectorAll("input, select, textarea").forEach((el) => {
            if (el.tagName === "SELECT") {
              el.value = "";
              return;
            }
            if (el.type === "file") {
              el.value = "";
              return;
            }
            el.value = "";
          });
        });
      }

      if (submitBtn) {
        submitBtn.addEventListener("click", () => {
          alert("Maintenance request submitted");
        });
      }
    })();
  </script>
</body>
</html>
