<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Courtyards | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-page">
  <main class="container-fluid login-shell py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="login-wrap">

          <!-- Logo -->
          <div class="text-center login-logo">
            <img src="images/logo0.png" class="logo-main img-fluid" alt="The Courtyards logo">
          </div>

          <!-- Glass box -->
          <div class="card login-card border-0">
            <div class="card-body px-4 px-md-5 pb-5 pt-4">

              <form class="row g-4 justify-content-center" id="loginForm">
                <div class="col-12 col-md-10">
                  <label for="email" class="form-label fw-semibold">Email</label>
                  <input name="email" type="email" class="form-control form-control-lg input-underline" id="email" required>
                </div>

                <div class="col-12 col-md-10">
                  <label for="password" class="form-label fw-semibold">Password</label>
                  <input name="password" type="password" class="form-control form-control-lg input-underline" id="password" required>
                </div>

                <div class="col-12 col-md-10 position-relative">
                  <select name="role" id="role" class="form-select form-select-lg select-underline" required>
                    <option value="" selected disabled>Role Selector</option>
                    <option value="resident">Current Resident</option>
                    <option value="admin">Admin</option>
                    <option value="maintenance">Maintenance</option>
                  </select>
                </div>

                <div class="col-12 col-md-10 d-grid mt-2">
                  <button type="submit" class="btn btn-brand btn-lg">Sign In</button>
                </div>

                <div class="col-12 col-md-10 text-center mt-3">
                  <a class="guest-link d-inline-block" href="floorplan.html">
                    Continue as Guest
                  </a>
                </div>
              </form>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var loginForm = document.getElementById("loginForm");
      var roleSelect = document.getElementById("role");

      if (!loginForm || !roleSelect) return;

      var roleDestinations = {
        resident: "Res_Dash2.html",
        admin: "Admindash.html",
        maintenance: "maintenance.html"
      };

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        var selectedRole = roleSelect.value;
        var destination = roleDestinations[selectedRole];

        if (!destination) return;

        window.location.href = destination;
      });
    })();
  </script>
</body>
</html>
