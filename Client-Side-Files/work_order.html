<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courtyards My Work Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/vars1.css" />
  <link rel="stylesheet" href="./css/style1.css" />
</head>
<body>
  <div class="workorders-page">
    <img class="background" src="images/background0.png" alt="Courtyards background" />

    <header class="top-header">
      <div class="header-left">
        <img class="logo" src="images/logo0.png" alt="Courtyards logo" />
      </div>

      <div class="header-center">
        <h1 id="pageTitle">My Work Orders</h1>
      </div>

      <div class="header-right">
        <button class="profile-btn" type="button" aria-label="Profile"></button>
        <div class="role-indicator" id="roleIndicator">Maintenance</div>
        <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <div class="container-fluid page-shell">
      <div class="row">
        <!-- Sidebar -->
        <aside class="col-lg-2 col-md-3 sidebar">
          <nav class="sidebar-nav">
            <a class="nav-link-custom" id="dashboardLink" href="maintenance.html">Dashboard</a>
            <a class="nav-link-custom active" id="workOrdersLink" href="work_order.html">My Work Orders</a>
            <a class="nav-link-custom" id="scheduleLink" href="schedule.html">Schedule</a>
          </nav>
        </aside>

        <!-- Main Content -->
        <main class="col-lg-10 col-md-9 main-content">
          <!-- Filters -->
          <section class="filters-bar">
            <div class="filters-label">Filters</div>

            <select id="statusFilter" class="filter-input">
              <option value="">Status</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Assigned">Assigned</option>
              <option value="Closed">Closed</option>
            </select>

            <select id="priorityFilter" class="filter-input">
              <option value="">Priority</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>

            <select id="buildingFilter" class="filter-input">
              <option value="">Building</option>
              <option value="A">Building A</option>
              <option value="B">Building B</option>
              <option value="C">Building C</option>
            </select>

            <input
              id="searchFilter"
              class="filter-input search-input"
              type="text"
              placeholder="WO# / Unit / Resident"
            />

            <button id="applyFiltersBtn" class="apply-btn" type="button">Apply</button>
          </section>

          <section class="row g-4 content-row">
            <!-- Left side -->
            <div class="col-xl-5">
              <div class="panel-box workorder-list-panel">
                <h2>Work Order Queue</h2>

                <div class="table-responsive workorder-scroll">
                  <table class="table custom-table align-middle mb-3">
                    <thead>
                      <tr>
                        <th>WO#</th>
                        <th>Unit</th>
                        <th>Issue</th>
                        <th>Priority</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody id="workOrderQueueBody"></tbody>
                  </table>
                </div>

                <div class="pager-wrap">
                  <button class="pager-btn" id="prevBtn" type="button">Prev</button>
                  <button class="pager-btn" id="nextBtn" type="button">Next</button>
                </div>
              </div>
            </div>

            <!-- Right side -->
            <div class="col-xl-7">
              <div class="details-panel">
                <h2>Work Order Details</h2>

                <div class="detail-card">
                  <p id="woMeta1"></p>
                  <p id="woMeta2"></p>
                  <p id="woMeta3"></p>
                  <p id="woMeta4"></p>
                </div>

                <h3>Issue Description</h3>
                <div class="detail-card description-card">
                  <p id="issueDescription"></p>
                </div>

                <h3>Attachments</h3>
                <div class="detail-card attachments-card">
                  <a href="#" id="attachmentLink">Photo/File View/Download</a>
                </div>

                <h3>Assign &amp; Schedule</h3>
                <div class="assign-grid">
                  <select id="assignUnit" class="assign-input">
                    <option>Assign Unit</option>
                    <option>Building A / Unit 2A</option>
                    <option>Building B / Unit 3C</option>
                    <option>Building C / Unit 1B</option>
                  </select>

                  <input id="scheduleDate" class="assign-input" type="date" />

                  <select id="timeWindow" class="assign-input">
                    <option>Time Window</option>
                    <option>8:00 AM - 10:00 AM</option>
                    <option>10:00 AM - 12:00 PM</option>
                    <option>1:00 PM - 3:00 PM</option>
                    <option>3:00 PM - 5:00 PM</option>
                  </select>

                  <select id="statusUpdate" class="assign-input">
                    <option>Update Status</option>
                    <option>Assigned</option>
                    <option>In Progress</option>
                    <option>Closed</option>
                  </select>
                </div>

                <h4>Notes to Maintenance / Resident</h4>
                <textarea id="notesBox" class="notes-box" placeholder="Enter notes here..."></textarea>

                <div class="action-buttons">
                  <button id="assignBtn" class="action-btn" type="button">Assign Work Order</button>
                  <button id="saveBtn" class="action-btn" type="button">Save Update</button>
                  <button id="closeBtn" class="action-btn" type="button">Close WO</button>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script>
    const pageParams = new URLSearchParams(window.location.search);
    const isAdminView = pageParams.get("role") === "admin";
    const roleIndicator = document.getElementById("roleIndicator");
    const pageTitle = document.getElementById("pageTitle");
    const dashboardLink = document.getElementById("dashboardLink");
    const workOrdersLink = document.getElementById("workOrdersLink");
    const scheduleLink = document.getElementById("scheduleLink");

    if (isAdminView) {
      document.title = "Courtyards Work Orders";
      roleIndicator.textContent = "Admin";
      pageTitle.textContent = "Work Orders";
      dashboardLink.href = "Admindash.html";
      workOrdersLink.href = "work_order.html?role=admin";
      workOrdersLink.textContent = "Work Orders";
      scheduleLink.href = "schedule.html?role=admin";
    } else {
      document.title = "Courtyards My Work Orders";
      roleIndicator.textContent = "Maintenance";
      pageTitle.textContent = "My Work Orders";
      dashboardLink.href = "maintenance.html";
      workOrdersLink.href = "work_order.html";
      workOrdersLink.textContent = "My Work Orders";
      scheduleLink.href = "schedule.html";
    }

    const workOrders = [
      {
        id: "WO501",
        building: "A",
        unit: "2A",
        resident: "Maya Johnson",
        phone: "410-555-1822",
        issue: "Leaking sink",
        category: "Plumbing",
        requested: "03/11/26",
        priority: "High",
        status: "Open",
        description: "Resident reported steady water leaking from the kitchen sink pipe under the cabinet.",
        attachment: "plumbing-photo.jpg"
      },
      {
        id: "WO502",
        building: "B",
        unit: "3C",
        resident: "Jordan Lee",
        phone: "410-555-9931",
        issue: "Broken AC",
        category: "HVAC",
        requested: "03/10/26",
        priority: "High",
        status: "In Progress",
        description: "Air conditioning unit is running but not cooling the apartment properly.",
        attachment: "ac-unit-ticket.pdf"
      },
      {
        id: "WO503",
        building: "C",
        unit: "1B",
        resident: "Ava Williams",
        phone: "410-555-6721",
        issue: "Light fixture out",
        category: "Electrical",
        requested: "03/09/26",
        priority: "Low",
        status: "Open",
        description: "Bedroom ceiling light fixture is not turning on even after bulb replacement.",
        attachment: "electrical-note.docx"
      },
      {
        id: "WO504",
        building: "A",
        unit: "4D",
        resident: "Marcus Lee",
        phone: "410-555-1144",
        issue: "Door won’t lock",
        category: "Security",
        requested: "03/08/26",
        priority: "High",
        status: "Assigned",
        description: "Front door lock sticks and does not fully engage when closed.",
        attachment: "door-lock-photo.png"
      },
      {
        id: "WO505",
        building: "B",
        unit: "2F",
        resident: "Jada Thompson",
        phone: "410-555-8888",
        issue: "Clogged drain",
        category: "Plumbing",
        requested: "03/07/26",
        priority: "Medium",
        status: "Open",
        description: "Bathroom sink draining slowly and backing up after use.",
        attachment: "drain-request.jpg"
      },
      {
        id: "WO506",
        building: "C",
        unit: "5A",
        resident: "Noah Carter",
        phone: "410-555-3201",
        issue: "Window crack",
        category: "General Repair",
        requested: "03/06/26",
        priority: "Low",
        status: "Closed",
        description: "Resident noticed a crack in the bedroom window pane after cold weather.",
        attachment: "window-report.pdf"
      }
    ];

    let filteredOrders = [...workOrders];
    let currentIndex = 0;

    function renderQueue() {
      const tbody = document.getElementById("workOrderQueueBody");
      tbody.innerHTML = filteredOrders.map((order, index) => `
        <tr data-index="${index}" class="queue-row ${index === currentIndex ? "selected-row" : ""}">
          <td>${order.id}</td>
          <td>${order.unit}</td>
          <td>${order.issue}</td>
          <td>${order.priority}</td>
          <td>${order.status}</td>
        </tr>
      `).join("");

      document.querySelectorAll(".queue-row").forEach((row) => {
        row.addEventListener("click", () => {
          currentIndex = Number(row.dataset.index);
          renderQueue();
          renderDetails();
        });
      });
    }

    function renderDetails() {
      const order = filteredOrders[currentIndex];
      if (!order) {
        document.getElementById("woMeta1").textContent = "";
        document.getElementById("woMeta2").textContent = "";
        document.getElementById("woMeta3").textContent = "";
        document.getElementById("woMeta4").textContent = "";
        document.getElementById("issueDescription").textContent = "No work orders match the current filters.";
        document.getElementById("attachmentLink").textContent = "";
        document.getElementById("attachmentLink").removeAttribute("href");
        return;
      }

      document.getElementById("woMeta1").textContent = `WO #: ${order.id}   Status: ${order.status}`;
      document.getElementById("woMeta2").textContent = `Unit: Building ${order.building} / Unit ${order.unit}   Priority: ${order.priority}`;
      document.getElementById("woMeta3").textContent = `Resident: ${order.resident}   Phone: ${order.phone}`;
      document.getElementById("woMeta4").textContent = `Issue Category: ${order.category}   Requested: ${order.requested}`;
      document.getElementById("issueDescription").textContent = order.description;
      document.getElementById("attachmentLink").textContent = order.attachment;
      document.getElementById("attachmentLink").setAttribute("href", "#");
    }

    function applyFilters() {
      const status = document.getElementById("statusFilter").value;
      const priority = document.getElementById("priorityFilter").value;
      const building = document.getElementById("buildingFilter").value;
      const search = document.getElementById("searchFilter").value.toLowerCase().trim();

      filteredOrders = workOrders.filter((order) => {
        const matchesStatus = !status || order.status === status;
        const matchesPriority = !priority || order.priority === priority;
        const matchesBuilding = !building || order.building === building;
        const matchesSearch =
          !search ||
          order.id.toLowerCase().includes(search) ||
          order.unit.toLowerCase().includes(search) ||
          order.resident.toLowerCase().includes(search);

        return matchesStatus && matchesPriority && matchesBuilding && matchesSearch;
      });

      currentIndex = 0;
      renderQueue();
      renderDetails();
    }

    document.getElementById("applyFiltersBtn").addEventListener("click", applyFilters);

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQueue();
        renderDetails();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentIndex < filteredOrders.length - 1) {
        currentIndex++;
        renderQueue();
        renderDetails();
      }
    });

    document.getElementById("assignBtn").addEventListener("click", () => {
      alert("Work order assigned.");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      alert("Work order update saved.");
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      alert("Work order closed.");
    });

    renderQueue();
    renderDetails();
  </script>

  <script src="./js/logout.js"></script>
</body>
</html>
