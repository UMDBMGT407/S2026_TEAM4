<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f0f0f0, #d9d9d9);
      font-family: "Montserrat", sans-serif;
      color: #111;
    }

    .access-card {
      width: min(92vw, 420px);
      padding: 32px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: #7a7a7a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="access-card">
    <h1>Access Denied</h1>
    <p>You do not have permission to view this page with your current login.</p>
    <a href="{{ url_for('access_denied_exit') }}">Go Back</a>
  </main>
</body>
</html>
