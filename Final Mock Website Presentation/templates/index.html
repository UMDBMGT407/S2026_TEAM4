<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Courtyards | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/logo-uniform.css') }}">
</head>
<body class="login-page">
  <main class="container-fluid login-shell py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="login-wrap">
          <div class="text-center login-logo">
            <img
              src="{{ url_for('static', filename='images/logo0.png') }}"
              class="logo-main img-fluid"
              alt="The Courtyards logo"
            >
          </div>

          <div class="container mt-5">
            <h2 class="mb-4 text-center">Login</h2>

            {% if error %}
              <div class="alert alert-danger mx-auto" style="max-width: 420px;">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" class="mx-auto" style="max-width: 420px;">
              <input type="hidden" name="next" value="{{ next_page or '' }}">
              <div class="form-group mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" name="email" required>
              </div>

              <div class="form-group mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control" name="password" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
              </div>
            </form>

            <div class="text-center mt-3">
              <a class="guest-link d-inline-block" href="{{ url_for('floorplan') }}">
                Continue as Guest
              </a>
            </div>

            <hr class="my-4">

            <div class="mx-auto" style="max-width: 420px;">
              <h3 class="h5 text-center mb-3">Create Prospective Resident Account</h3>
              <form method="POST" action="{{ url_for('prospect_register') }}">
                <input type="hidden" name="next" value="apply">
                <div class="form-group mb-3">
                  <label for="registerName" class="form-label">Name</label>
                  <input id="registerName" type="text" class="form-control" name="name" required>
                </div>
                <div class="form-group mb-3">
                  <label for="registerEmail" class="form-label">Email</label>
                  <input id="registerEmail" type="email" class="form-control" name="email" required>
                </div>
                <div class="form-group mb-3">
                  <label for="registerPassword" class="form-label">Password</label>
                  <input id="registerPassword" type="password" class="form-control" name="password" required minlength="8" autocomplete="new-password">
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-dark">Create Account &amp; Apply</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
