<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/Maint_Req.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/logo-uniform.css') }}">


  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
       -webkit-font-smoothing: antialiased;
   }

   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
  </style>
  <title>The Courtyards | Maintenance Request</title>
</head>
<body>
  <div class="cr-02-maintenance-request">
    <div class="rectangle-5"></div>
    <img class="background" src="{{ url_for('static', filename='images/background0.png') }}" alt="" />
    <header class="top-header">
      <div class="header-left">
        <a href="{{ url_for('res_dash2') }}"><img class="logo" src="{{ url_for('static', filename='images/logo0.png') }}" alt="Courtyards logo" /></a>
      </div>
      <div class="header-center">
        <h1>Maintenance Request</h1>
      </div>
      <div class="header-right">
        <button class="profile-btn" type="button" aria-label="Profile"></button>
        <div class="role-indicator"><span class="user-role">Resident</span></div>
        <a class="logout-btn" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </header>
    <div class="sidebar"></div>
    <div class="nav-buttons">
      <a href="{{ url_for('res_dash2') }}" class="dashboard">Dashboard</a>
      <a href="{{ url_for('pay_rent') }}" class="pay-rent">Pay Rent</a>
      <a href="{{ url_for('maint_req') }}" class="maintenance">Maintenance</a>
      <a href="{{ url_for('lease_info') }}" class="my-lease">My Lease</a>
    </div>
    <div class="rectangle-9"></div>
    <div class="priority">Priority</div>
    <div class="rectangle-16"></div>
    <div class="submit-a-maintenance-request">Submit A Maintenance Request</div>
    <div class="rectangle-10"></div>
    <div class="rectangle-12"></div>
    <img class="polygon-2" src="{{ url_for('static', filename='images/polygon-20.svg') }}" />
    <div class="rectangle-14"></div>
    <div class="rectangle-11"></div>
    <div class="rectangle-13"></div>
    <div class="rectangle-15"></div>
    <button class="cancel" type="button" id="cancel-clear">Cancel</button>
    <div class="issue-category">Issue Category</div>
    <select class="dropdown-issue-category" name="issue-category" aria-label="Issue category" required>
      <option value="">Select category</option>
      <option value="plumbing">Plumbing</option>
      <option value="electrical">Electrical</option>
      <option value="hvac">HVAC / Heating</option>
      <option value="appliance">Appliance</option>
      <option value="pest">Pest control</option>
      <option value="other">Other</option>
    </select>
    <div class="location-unit-room">Location (Unit/room)</div>
    <input
      class="dropdown-location"
      type="text"
      name="location"
      aria-label="Location (unit/room)"
      placeholder="Enter location"
    />
    <select class="dropdown-priority" name="priority" aria-label="Priority" required>
      <option value="">Select priority</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
    <div class="preferred-access-time">Preferred Access Time</div>
    <select class="dropdown-access-time" name="access-time" aria-label="Preferred access time">
      <option value="">Select time</option>
      <option value="morning">Morning (8am-12pm)</option>
      <option value="afternoon">Afternoon (12pm-5pm)</option>
      <option value="evening">Evening (5pm-8pm)</option>
      <option value="any">Any time</option>
    </select>
    <div class="rectangle-17"></div>
    <div class="describe-the-issue">Describe the issue</div>
    <textarea
      class="issue-description-input"
      name="issue-description"
      aria-label="Describe the issue"
      placeholder="Type details"
      rows="3"
      required
      minlength="5"
    ></textarea>
    <img class="polygon-1" src="{{ url_for('static', filename='images/polygon-10.svg') }}" />
    <img class="polygon-3 location-arrow-hidden" src="{{ url_for('static', filename='images/polygon-30.svg') }}" />
    <img class="polygon-4" src="{{ url_for('static', filename='images/polygon-40.svg') }}" />
    <div class="rectangle-18"></div>
    <button
      class="submit-request-button"
      type="button"
      id="submit-request-button"
    >
      Submit Request
    </button>
    <input class="upload-photo-file" type="file" name="upload-photo-file" aria-label="Upload photo or file" />
    <textarea
      class="access-notes-instructions"
      name="access-notes"
      aria-label="Access notes / instructions"
      placeholder="Access notes / instructions"
      rows="2"
    ></textarea>
    <p class="maintenance-form-message" id="maintenance-form-message" hidden></p>

    <div class="my-requests-panel" id="my-requests-panel">
      <h2 style="font-size:1rem; font-weight:700; margin-bottom:14px; color:#222;">
        My Maintenance Requests
      </h2>
      <div id="requests-table-wrap" style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
          <thead>
            <tr style="background:#f4f4f4; text-align:left;">
              <th style="padding:7px 10px;">Request #</th>
              <th style="padding:7px 10px;">Issue</th>
              <th style="padding:7px 10px;">Priority</th>
              <th style="padding:7px 10px;">Status</th>
              <th style="padding:7px 10px;">Work Order</th>
              <th style="padding:7px 10px;">Scheduled</th>
              <th style="padding:7px 10px;">Submitted</th>
            </tr>
          </thead>
          <tbody id="requests-tbody">
            <tr><td colspan="7" style="padding:12px 10px; color:#777;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const MAINTENANCE_SUBMIT_URL = {{ url_for('maintenance_request_submit') | tojson }};
    const MAINTENANCE_STATUS_URL = {{ url_for('resident_maintenance_status') | tojson }};

    (function () {
      const root = document.querySelector(".cr-02-maintenance-request");
      const cancelBtn = document.getElementById("cancel-clear");
      const submitBtn = document.getElementById("submit-request-button");
      const formMessage = document.getElementById("maintenance-form-message");
      if (!root) return;

      function showFormMessage(message, isError) {
        if (!formMessage) return;
        formMessage.hidden = false;
        formMessage.textContent = message;
        formMessage.classList.remove("error", "success");
        formMessage.classList.add(isError ? "error" : "success");
      }

      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          root.querySelectorAll("input, select, textarea").forEach((el) => {
            if (el.tagName === "SELECT") {
              el.value = "";
              return;
            }
            if (el.type === "file") {
              el.value = "";
              return;
            }
            el.value = "";
          });
          if (formMessage) {
            formMessage.hidden = true;
            formMessage.textContent = "";
            formMessage.classList.remove("error", "success");
          }
        });
      }

      if (submitBtn) {
        submitBtn.addEventListener("click", () => {
          const fd = new FormData();
          const category = root.querySelector('[name="issue-category"]');
          const location = root.querySelector('[name="location"]');
          const priority = root.querySelector('[name="priority"]');
          const accessTime = root.querySelector('[name="access-time"]');
          const description = root.querySelector('[name="issue-description"]');
          const accessNotes = root.querySelector('[name="access-notes"]');
          const attachment = root.querySelector('[name="upload-photo-file"]');
          const descriptionValue = String(description?.value || "").trim();

          if (!String(category?.value || "").trim()) {
            showFormMessage("Choose an issue category.", true);
            return;
          }
          if (!String(priority?.value || "").trim()) {
            showFormMessage("Choose a priority level.", true);
            return;
          }
          if (!descriptionValue) {
            showFormMessage("Describe the issue before submitting.", true);
            return;
          }
          if (descriptionValue.length < 5) {
            showFormMessage("Issue description must be at least 5 characters.", true);
            return;
          }

          if (formMessage) {
            formMessage.hidden = true;
            formMessage.textContent = "";
            formMessage.classList.remove("error", "success");
          }

          const accessTimeValue = String(accessTime?.value || "").trim();
          const accessNotesValue = String(accessNotes?.value || "").trim();
          const fullDescription = [
            descriptionValue,
            accessTimeValue ? `Preferred access time: ${accessTimeValue}` : "",
            accessNotesValue ? `Access notes: ${accessNotesValue}` : "",
          ].filter(Boolean).join("\n");

          fd.append("category", category ? category.value : "");
          fd.append("location", location ? location.value : "");
          fd.append("priority", priority ? priority.value : "");
          fd.append("access_time", accessTime ? accessTime.value : "");
          fd.append("description", fullDescription);
          if (attachment && attachment.files && attachment.files[0]) {
            fd.append("attachment", attachment.files[0]);
          }

          fetch(MAINTENANCE_SUBMIT_URL, {
            method: "POST",
            body: fd,
            credentials: "same-origin",
          })
            .then((res) => res.json().then((data) => ({ res, data })))
            .then(({ res, data }) => {
              if (!res.ok) {
                showFormMessage(data.error || "Could not submit maintenance request.", true);
                return;
              }
              showFormMessage(`${data.message} Request #: ${data.request_code}`, false);
              root.querySelectorAll("input, select, textarea").forEach((el) => {
                if (el.tagName === "SELECT" || el.type === "file") {
                  el.value = "";
                  return;
                }
                el.value = "";
              });
              loadRequests();
            })
            .catch(() => {
              showFormMessage("Could not submit maintenance request.", true);
            });
        });
      }
    })();

    const STATUS_COLORS = {
      "Open": "#b45309",
      "Assigned": "#1d4ed8",
      "In Progress": "#7c3aed",
      "Closed": "#1a7f37",
    };

    function loadRequests() {
      const tbody = document.getElementById("requests-tbody");
      if (!tbody) return;
      fetch(MAINTENANCE_STATUS_URL, { credentials: "same-origin" })
        .then((res) => res.json())
        .then((rows) => {
          if (!rows.length) {
            tbody.innerHTML =
              '<tr><td colspan="7" style="padding:12px 10px; color:#777;">No maintenance requests yet.</td></tr>';
            return;
          }
          tbody.innerHTML = rows
            .map((r) => {
              const color = STATUS_COLORS[r.status] || "#555";
              return `
                <tr style="border-bottom:1px solid #eee;">
                  <td style="padding:7px 10px;">${r.request_code}</td>
                  <td style="padding:7px 10px;">${r.issue_title}</td>
                  <td style="padding:7px 10px;">${r.priority}</td>
                  <td style="padding:7px 10px; font-weight:600; color:${color};">${r.status}</td>
                  <td style="padding:7px 10px;">${r.work_order_code || "-"}</td>
                  <td style="padding:7px 10px;">${r.scheduled_date !== "-" ? r.scheduled_date + (r.time_window !== "-" ? "<br><small>" + r.time_window + "</small>" : "") : "-"}</td>
                  <td style="padding:7px 10px;">${r.created_at}</td>
                </tr>`;
            })
            .join("");
        })
        .catch(() => {
          tbody.innerHTML =
            '<tr><td colspan="7" style="padding:12px 10px; color:#b42318;">Could not load requests.</td></tr>';
        });
    }

    loadRequests();
  </script>
</body>
</html>
